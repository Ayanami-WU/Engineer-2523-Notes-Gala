name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build And Deploy Static Site
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /home/deploy/mkdocs-site
      RELEASE_SHA: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs and plugins
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mkdocs-material==9.7.0" -r requirements.txt

      - name: Enforce tracked file size limit
        run: |
          set -eu
          limit=$((95 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if [ "$size" -gt "$limit" ]; then
              echo "Tracked file exceeds 95 MB: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)
          if [ "$failed" -ne 0 ]; then
            echo "Refusing to continue with oversized tracked files."
            exit 1
          fi

      - name: Build site strictly
        run: mkdocs build --strict

      - name: Package release artifact
        run: tar -C site -czf site.tar.gz .

      - name: Upload release artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: site.tar.gz
          target: /tmp/mkdocs-release-${{ github.sha }}
          overwrite: true

      - name: Activate release on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          envs: DEPLOY_PATH,RELEASE_SHA
          script: |
            set -eu

            incoming_dir="$DEPLOY_PATH/incoming"
            release_dir="$DEPLOY_PATH/releases/$RELEASE_SHA"
            tmp_upload_dir="/tmp/mkdocs-release-$RELEASE_SHA"

            mkdir -p "$incoming_dir" "$DEPLOY_PATH/releases"
            archive_path="$(find "$tmp_upload_dir" -type f -name 'site.tar.gz' | head -n 1)"
            if [ -z "$archive_path" ]; then
              echo "Uploaded archive not found"
              exit 1
            fi
            mv "$archive_path" "$incoming_dir/site-$RELEASE_SHA.tar.gz"
            rm -rf "$tmp_upload_dir"

            rm -rf "$release_dir"
            mkdir -p "$release_dir"
            tar -xzf "$incoming_dir/site-$RELEASE_SHA.tar.gz" -C "$release_dir"
            ln -sfn "$release_dir" "$DEPLOY_PATH/current"
            rm -f "$incoming_dir/site-$RELEASE_SHA.tar.gz"

            if [ -L "$DEPLOY_PATH/current" ] && [ -f "$DEPLOY_PATH/current/index.html" ]; then
              echo "Release activated: $RELEASE_SHA"
            else
              echo "Release activation failed"
              exit 1
            fi

      - name: Deployment complete
        run: |
          echo "Deployment complete for commit ${{ github.sha }}"
          echo "Server: ${{ secrets.SERVER_HOST }}"
