name: Deploy to Server

# 触发条件：推送到 main 分支
on:
  push:
    branches:
      - main
      - master
  # 也可以手动触发
  workflow_dispatch:

# 并发控制：同一时间只允许一个部署任务运行
# 新的部署会自动取消正在运行的旧部署
concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. 显示部署信息
      - name: Display deployment info
        run: |
          echo "=========================================="
          echo "GitHub Actions - 服务器端自动化部署"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          echo "=========================================="

      # 3. 部署到服务器（使用 appleboy/ssh-action）
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_DIR=~/mkdocs-deploy
            SCRIPT_NAME=build-and-deploy-server.sh
            REPO_URL=https://github.com/${{ github.repository }}.git

            echo "→ 进入部署目录..."
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            echo "→ 下载最新部署脚本..."
            rm -f $SCRIPT_NAME
            wget -q https://raw.githubusercontent.com/${{ github.repository }}/main/.deploy/build-and-deploy-server.sh -O $SCRIPT_NAME
            chmod +x $SCRIPT_NAME
            echo "✓ 部署脚本已下载"

            echo ""
            echo "=========================================="
            echo "开始执行服务器端构建和部署..."
            echo "=========================================="

            bash $SCRIPT_NAME

            echo ""
            echo "=========================================="
            echo "部署完成！"
            echo "=========================================="

      # 4. 显示完成信息
      - name: Deployment complete
        run: |
          echo ""
          echo "✓ 部署成功完成"
          echo "访问地址: http://${{ secrets.SERVER_HOST }}:8111"
          echo ""
