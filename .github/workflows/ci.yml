name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    name: Validate MkDocs Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MkDocs and plugins
        run: |
          python -m pip install --upgrade pip
          python -m pip install "mkdocs-material==9.7.0" -r requirements.txt

      - name: Enforce tracked file size limit
        run: |
          set -eu
          limit=$((95 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if [ "$size" -gt "$limit" ]; then
              echo "Tracked file exceeds 95 MB: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)
          if [ "$failed" -ne 0 ]; then
            echo "Refusing to continue with oversized tracked files."
            exit 1
          fi

      - name: Build site strictly
        run: mkdocs build --strict
