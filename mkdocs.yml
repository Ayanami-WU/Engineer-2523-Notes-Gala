site_name: 工试2523の笔记本
site_url: https://github.com/Ayanami-WU/Engineer-2523-Notes-Gala/
repo_name: Ayanami-WU/Engineer-2523-Notes-Gala
repo_url: https://github.com/Ayanami-WU/Engineer-2523-Notes-Gala/
edit_uri: tree/main/docs
site_description: 工试2523の大学课程学习笔记
copyright: Copyright &copy; 2024-2025 工试2523 & Ayanami-WU

theme: 
  name: 'material'
  language: 'zh'
  icon: 
    logo: material/notebook-outline
  custom_dir: overrides
  static_templates:
    - redirection.html
  features:
    - content.code.annotate
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.footer
    - navigation.indexes
  font: false
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 4
  - meta
  - def_list
  - attr_list
  - md_in_html
  - sane_lists
  - admonition
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.magiclink
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Ayanami-WU/
    - icon: fontawesome/solid/envelope
      link: mailto:wumingxuan@zju.edu.cn
  # analytics:
  #   provider: custom
  #   property: YOUR_ANALYTICS_ID

extra_css:
  - katex/katex.min.css
  - css/fonts.css
  - css/tasklist.css
  - css/custom.css
  - css/card.css
  - css/flink.css
  - css/friends.css
  - css/changelog_extra.css
  - css/toc_extra.css
  - css/svg_extra.css

extra_javascript:
  - katex/katex.min.js
  - js/katex.js
  - js/scheme.js
  - js/toc.js

plugins:
  - rss:
      enabled: !ENV [FULL, false]
  - search
  - glightbox:
      width: 80%
  # - encryptcontent:  # Commented out - not needed for course notes
  #     title_prefix: "🔒 "
  #     remember_password: True
  #     default_expire_dalay: 48
  #     decryption_failure_message: '密码错误'
  #     encrypted_something:
  #       mkdocs-encrypted-toc: [nav, class]
  - git-revision-date-localized:
      enabled: !ENV [FULL, false]
      type: datetime
      timezone: Asia/Shanghai
      locale: zh
      enable_creation_date: true
      enable_git_follow: true
      ignored_commits_file: .ignored-commits
      exclude:
        - index.md
        - writeups/AAA.md
  - changelog
  - statistics:
      page_check_metadata: comment
  - heti:
      enabled: !ENV [FULL, false]
      disable_serve: false

hooks:
  - hooks/theme_override.py
  - hooks/linkbackward.py
  - hooks/toc.py
  - hooks/tikzautomata.py

not_in_nav: todo.md


nav:
  - 首页: index.md
  - 微积分:
    - calculus/index.md
    - 微积分（甲）II: calculus/ii.md
    - 微积分（甲）I: calculus/i.md
  - 线性代数: linear-algebra/index.md
  - C程序设计: c-programming/index.md
  - 工程图学: engineering-graphics/index.md
  - 大学英语: college-english/index.md
  - 常微分方程: ode/index.md
  - 大学物理: physics/index.md
  - 机械制图: mechanical-drawing/index.md
  - 人工智能基础: ai-fundamentals/index.md
  - 形势与政策: politics/index.md
  - 参考笔记: tonycrane-notes.md
  - 友情链接: friends.md
